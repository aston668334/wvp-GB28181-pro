version: '3'
services:
  polaris-redis:
    image: redis:latest
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - media-net
    volumes:
      - ./docker/redis/conf/redis.conf:/opt/polaris/redis/redis.conf
      - redis_data:/data
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server /opt/polaris/redis/redis.conf --appendonly yes

  polaris-mysql:
    image: mysql:8
    restart: unless-stopped
    networks:
      - media-net
    environment:
      MYSQL_DATABASE: wvp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: wvp_user
      MYSQL_PASSWORD: wvp_password
      TZ: Asia/Shanghai
    volumes:
      - mysql_data_v3:/var/lib/mysql  
      - ./docker/mysql/db:/docker-entrypoint-initdb.d
    command: [
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_general_ci',
          '--default-time-zone=+8:00'
        ]

  polaris-media:
    image: zlmediakit/zlmediakit:master
    restart: always
    networks:
      - media-net
    ports:
      - "${MediaRtmp:-10935}:${MediaRtmp:-10935}/tcp"
      - "${MediaRtmp:-10935}:${MediaRtmp:-10935}/udp"
      - "${MediaRtsp:-5540}:${MediaRtsp:-5540}/tcp"
      - "${MediaRtsp:-5540}:${MediaRtsp:-5540}/udp"
      - "${MediaRtp:-10000}:${MediaRtp:-10000}/tcp"
      - "${MediaRtp:-10000}:${MediaRtp:-10000}/udp"
    volumes:
      - video_recordings:/opt/media/bin/www/record/
      - ./docker/media/config.ini:/conf/config.ini
    command: [
        'MediaServer',
        '-c', '/conf/config.ini',
        '-l', '0'
    ]

  polaris-wvp:
    build:
      context: .
      dockerfile: ./docker/wvp/Dockerfile
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "18978:18978"
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/udp"
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/tcp"
    depends_on:
      - polaris-redis
      - polaris-mysql
      - polaris-media
    volumes:
      - ./docker/wvp/wvp/:/opt/ylcx/wvp/
    environment:
      TZ: "Asia/Shanghai"
      RUN_ENV: "docker"
      Stream_IP: ${Stream_IP}
      SDP_IP: ${SDP_IP}
      ZLM_HOOK_HOST: polaris-wvp
      ZLM_HOST: polaris-media
      ZLM_SERCERT: su6TiedN2rVAmBbIDX0aa0QTiBJLBdcf

      MediaHttp: ${WebHttp:-18080}
      MediaRtmp: ${MediaRtmp:-10935}
      MediaRtsp: ${MediaRtsp:-5540}
      MediaRtp: ${MediaRtp:-10000}

      REDIS_HOST: polaris-redis
      REDIS_PORT: 6379

      DATABASE_HOST: polaris-mysql
      DATABASE_PORT: 3306
      DATABASE_USER: wvp_user
      DATABASE_PASSWORD: wvp_password

      SIP_ShowIP: ${SIP_ShowIP}
      SIP_Port: ${SIP_Port:-8116}
      SIP_Domain: ${SIP_Domain}
      SIP_Id: ${SIP_Id}
      SIP_Password: ${SIP_Password}

      RecordSip: ${RecordSip}
      RecordPushLive: ${RecordPushLive}

  polaris-nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${WebHttp:-18080}:8080"
    depends_on:
      - polaris-wvp
    volumes:
      - ./docker/nginx/templates/:/etc/nginx/templates
    environment:
      Stream_IP: ${Stream_IP}
    networks:
      - media-net

networks:
  media-net:
    driver: bridge

volumes:
  mysql_data_v3:
  redis_data:
  video_recordings:
